<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>RESCENE MUSIC RATING · ALBUM ART</title>
<style>
:root{--bg:#f1f7fc;--card:#fff;--ink:#24364b;--muted:#70859b;--line:#dce8f2;--navy:#54799b;--blue:#eaf4fc;--accent:#9fc7e8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#dceefa 0,transparent 38%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
header{position:relative;z-index:10;background:linear-gradient(135deg,#284c70,#7199bc 58%,#b6d5ec);color:#fff;padding:18px 16px 16px;border-bottom:1px solid #c7dcec;overflow:hidden}header:after{content:"✦  ·  ✧";position:absolute;right:14px;top:12px;color:#f7edff;font-size:25px;opacity:.8}
h1{font-family:Georgia,serif;font-size:23px;margin:0 0 4px;font-weight:800;letter-spacing:.08em}.sub{font-size:11px;color:#f1eafa;letter-spacing:.08em}
main{max-width:720px;margin:0 auto;padding:14px 12px 80px}
.hero{position:relative;margin:14px auto 10px;max-width:720px;padding:0 12px;height:260px}
.hero img{display:block;width:100%;height:260px;object-fit:cover;object-position:center 48%;border-radius:17px;box-shadow:0 5px 18px #42698a24;background:#dceefa}
.hero-overlay{position:absolute;left:25px;bottom:18px;display:flex;flex-direction:column;gap:2px;color:#fff;text-shadow:0 2px 12px #10283d;pointer-events:none}
.hero-overlay span{font-size:9px;font-weight:800;letter-spacing:.2em}
.hero-overlay strong{font-family:Georgia,serif;font-size:30px;letter-spacing:.12em}

.album{margin:0 0 18px}.album-head{position:sticky;top:8px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(110deg,#4d7395,#8fb4d2);color:#fff;padding:9px 12px;border-radius:13px 13px 0 0;box-shadow:0 3px 12px #65508020}
.album-title-wrap{display:flex;align-items:center;gap:11px;min-width:0}.album-cover{width:54px;height:54px;flex:0 0 54px;object-fit:cover;border-radius:9px;border:1px solid #ffffff70;box-shadow:0 2px 8px #203c562c;background:#dceefa}.album-name{font-size:15px;font-weight:750;line-height:1.25}.album-sub{font-size:9px;letter-spacing:.08em;color:#e2f1fc;margin-top:4px}.album-avg{font-size:11px;color:#f2eafa;white-space:nowrap;text-align:right}.album-avg b{display:block;font-size:17px;color:#fff;margin:2px 0 0}
.song{background:var(--card);border:1px solid var(--line);border-top:0;padding:13px 14px 14px;box-shadow:0 2px 7px #26344908}.song:last-child{border-radius:0 0 13px 13px}.song-title{font-size:15px;font-weight:750;margin-bottom:11px}
.criteria{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{background:#f7fbff;border:1px solid #e3eef7;border-radius:10px;padding:8px 9px;min-width:0}
label{display:block;font-size:10px;line-height:1.25;letter-spacing:.025em;color:var(--muted);font-weight:750;margin-bottom:6px;min-height:25px}
select{width:100%;border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:700;outline:none;padding:1px 0}
.overall{margin-top:10px;padding:10px 12px;border-radius:10px;background:linear-gradient(100deg,#eaf4fb,#dcecf8);display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:750;color:#527493}
.overall strong{font-size:20px;color:#365875}.empty{color:#9aa6b4;font-size:13px;font-weight:600}
.tools{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}.tools button{border:1px solid #e4d8f0;background:#fff;border-radius:999px;padding:8px 12px;color:#365875;font-weight:650}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin:12px 3px}
@media(min-width:600px){.criteria{grid-template-columns:repeat(5,minmax(0,1fr))}.field{padding:9px 8px}label{min-height:38px}}
</style></head><body>

  const cover=albumCovers[ai]?document.createElement("img"):null;if(cover){cover.className="album-cover";cover.src=albumCovers[ai];cover.alt=album.name+" album cover";cover.loading="lazy";cover.referrerPolicy="no-referrer";}
  const titleBox=document.createElement("div");
  const name=document.createElement("div");name.className="album-name";name.textContent=album.name;
  const sub=document.createElement("div");sub.className="album-sub";sub.textContent=ai===0?"OST COLLECTION":ai===9?"4TH MINI ALBUM":"RESCENE RELEASE";
  titleBox.append(name,sub);if(cover)titleWrap.append(cover);titleWrap.append(titleBox);
  const av=document.createElement("div");av.className="album-avg";av.innerHTML='ALBUM AVG. <b>—</b>';
  head.append(titleWrap,av);section.append(head);
  let overallNodes=[];
  album.songs.forEach((song,si)=>{
   const id=ai+"_"+si; if(!saved[id]) saved[id]=song[1].slice();
   const card=document.createElement("article");card.className="song";
   const title=document.createElement("div");title.className="song-title";title.textContent=song[0];card.append(title);
   const grid=document.createElement("div");grid.className="criteria";
   const selects=[];
   labels.forEach((label,ci)=>{
    const wrap=document.createElement("div");wrap.className="field";
    const lab=document.createElement("label");lab.textContent=label;
    const sel=document.createElement("select");sel.setAttribute("aria-label",label+" 점수");
    const blank=document.createElement("option");blank.value="";blank.textContent="—";sel.append(blank);
    for(let n=0;n<=10;n++){let o=document.createElement("option");o.value=String(n);o.textContent=n+" / 10";sel.append(o)}
    sel.value=saved[id][ci]===null?"":String(saved[id][ci]);
    sel.addEventListener("change",()=>{saved[id][ci]=sel.value===""?null:Number(sel.value);persist();update()});
    wrap.append(lab,sel);grid.append(wrap);selects.push(sel);
   });
   card.append(grid);
   const overall=document.createElement("div");overall.className="overall";overall.innerHTML='<span>OVERALL</span><strong class="score">—</strong>';
   card.append(overall);section.append(card);
   overallNodes.push({id,score:overall.querySelector(".score")});
  });
  app.append(section);
  function updateAlbum(){
   const songAvgs=overallNodes.map(o=>avg(saved[o.id]||[])).filter(v=>v!==null);
   av.querySelector("b").textContent=fmt(avg(songAvgs),2);
   overallNodes.forEach(o=>o.score.textContent=fmt(avg(saved[o.id]||[]),1));
  }
  section._update=updateAlbum;
  updateAlbum();
 });
}
function update(){document.querySelectorAll(".album").forEach(s=>s._update&&s._update())}
document.getElementById("reset").onclick=()=>{if(confirm("입력한 점수를 모두 초기화할까요?")){saved={};persist();render()}};
document.getElementById("export").onclick=()=>{
 let rows=[["Album","Song",...labels,"Overall"]];
 albums.forEach((a,ai)=>a.songs.forEach((s,si)=>{let vals=saved[ai+"_"+si]||s[1];rows.push([a.name,s[0],...vals,avg(vals)===null?"":avg(vals).toFixed(1)])}));
 let csv=rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\n");
 let blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download="RESCENE_music_rating.csv";a.click();URL.revokeObjectURL(url);
};
render();
</script></body></html>
